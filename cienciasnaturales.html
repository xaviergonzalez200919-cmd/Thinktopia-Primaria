<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brainrot Biomas</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#89c2ff;
    font-family:'Press Start 2P', cursive;
    margin:0;
    min-height:100vh;
    transition:0.3s;
    image-rendering:pixelated;
    padding:20px;
}

/* PANTALLA INICIO */

#startScreen{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    overflow:auto;
    background:#5aa9ff;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:100;
    padding:20px;
}

.start-box{
    background:#fff;
    border:6px solid #000;
    padding:30px;
    width:650px;
    max-width:100%;
    text-align:center;
    box-shadow:12px 12px 0px #000;
}

.start-box h1{
    font-size:28px;
    margin-bottom:25px;
    line-height:1.5;
}

.start-box p{
    font-size:12px;
    line-height:1.8;
    margin-bottom:20px;
}

.start-box img{
    width:100%;
    height:260px;
    object-fit:cover;
    border:5px solid #000;
    margin-bottom:20px;
}

button{
    background:#ffe066;
    border:4px solid #000;
    padding:15px;
    cursor:pointer;
    font-family:'Press Start 2P', cursive;
    font-size:12px;
    transition:0.1s;
    box-shadow:5px 5px 0px #000;
}

button:hover{
    transform:translate(2px,2px);
    box-shadow:3px 3px 0px #000;
}

/* JUEGO */

.game{
    background:#fff;
    border:6px solid #000;
    padding:25px;
    width:950px;
    max-width:100%;
    margin:auto;
    box-shadow:12px 12px 0px #000;
}

.game h1{
    text-align:center;
    margin-bottom:25px;
    font-size:22px;
}

.top{
    display:flex;
    gap:20px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.animal-box{
    flex:1;
    min-width:280px;
}

.animal-box img{
    width:100%;
    height:320px;
    object-fit:cover;
    border:5px solid #000;
}

.info{
    flex:1;
    min-width:280px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.info h2{
    font-size:22px;
    margin-bottom:20px;
    line-height:1.5;
}

.info p{
    font-size:12px;
    line-height:2;
}

.question{
    text-align:center;
    margin-bottom:20px;
    font-size:16px;
    line-height:1.6;
}

.options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
}

.option{
    background:#eee;
    border:5px solid #000;
    cursor:pointer;
    transition:0.15s;
    box-shadow:6px 6px 0px #000;
}

.option:hover{
    transform:translate(2px,2px);
    box-shadow:3px 3px 0px #000;
}

.option img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-bottom:5px solid #000;
}

.option p{
    text-align:center;
    padding:12px;
    font-size:10px;
    line-height:1.6;
}

#result{
    text-align:center;
    margin-top:25px;
    font-size:18px;
    line-height:1.6;
}

/* ANIMACIONES */

@keyframes correctAnim{

    0%{ transform:scale(1); }

    25%{ transform:scale(1.08) rotate(2deg); }

    50%{ transform:scale(0.95) rotate(-2deg); }

    100%{ transform:scale(1); }

}

@keyframes wrongAnim{

    0%{ transform:translateX(0); }

    20%{ transform:translateX(-10px); }

    40%{ transform:translateX(10px); }

    60%{ transform:translateX(-10px); }

    80%{ transform:translateX(10px); }

    100%{ transform:translateX(0); }

}

.correct{
    border-color:#00aa00 !important;
    animation:correctAnim 0.6s ease;
    box-shadow:0 0 20px #00ff00;
}

.wrong{
    border-color:#ff0000 !important;
    animation:wrongAnim 0.5s ease;
    box-shadow:0 0 20px red;
}

.center{
    text-align:center;
}

/* RESPONSIVE */

@media(max-width:700px){

    .start-box h1{
        font-size:18px;
    }

    .game h1{
        font-size:16px;
    }

    .info h2{
        font-size:16px;
    }

    .question{
        font-size:12px;
    }

}

</style>
</head>

<body>

<!-- PANTALLA INICIO -->

<div id="startScreen">

    <div class="start-box">

        <h1>🌎 BRAINROT BIOMAS 🌎</h1>

        <p>
            descubre donde viven las criaturas mas dañadas del internet XD
        </p>

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1000&auto=format&fit=crop">

        <button onclick="startGame()">
            INICIAR
        </button>

    </div>

</div>

<!-- JUEGO -->

<div class="game">

    <h1>MINIJUEGO DE BIOMAS</h1>

    <div class="top">

        <div class="animal-box">
            <img id="animalImage" src="">
        </div>

        <div class="info">
            <h2 id="animalName"></h2>
            <p id="animalDesc"></p>
        </div>

    </div>

    <div class="question">
        ¿A QUE BIOMA PERTENECE?
    </div>

    <div class="options" id="options"></div>

    <div id="result"></div>

    <div class="center">
        <button onclick="nextQuestion()">
            SIGUIENTE
        </button>
    </div>

</div>

<script>

function startGame(){

    document.getElementById("startScreen").style.display = "none";

}

const biomes = [

    {
        name:"ACUATICO",
        image:"https://images.unsplash.com/photo-1544551763-46a013bb70d5?q=80&w=1000&auto=format&fit=crop"
    },

    {
        name:"PRADERA",
        image:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1000&auto=format&fit=crop"
    },

    {
        name:"BOSQUE",
        image:"https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1000&auto=format&fit=crop"
    },

    {
        name:"DESIERTO",
        image:"https://images.unsplash.com/photo-1509316785289-025f5b846b35?q=80&w=1000&auto=format&fit=crop"
    },

    {
        name:"TUNDRA",
        image:"https://images.unsplash.com/photo-1517783999520-f068d7431a60?q=80&w=1000&auto=format&fit=crop"
    }

];

const questions = [

    {
        animal:"BRR BRR PATAPIM",
        desc:"vive entre arboles enormes y naturaleza densa",
        image:"patapim.png",
        correct:"BOSQUE"
    },

    {
        animal:"TRALALERO TRALALA",
        desc:"criatura acuática legendaria del oceano",
        image:"tralalero.png",
        correct:"ACUATICO"
    },

    {
        animal:"BOMBARDIRO CROCODILO",
        desc:"sobrevive en zonas calientes y secas",
        image:"bombardiro.png",
        correct:"DESIERTO"
    },

    {
        animal:"TUNG TUNG TUNG SAHUR",
        desc:"corre libremente en campos abiertos",
        image:"sahur.png",
        correct:"PRADERA"
    },

    {
        animal:"BALLERINA CAPPUCCINA",
        desc:"vive en regiones congeladas y frias",
        image:"cappuccina.png",
        correct:"TUNDRA"
    },

    {
        animal:"CHIMPANZINI BANANINI",
        desc:"se esconde entre vegetacion y arboles",
        image:"bananini.png",
        correct:"BOSQUE"
    },

    {
        animal:"GLORBO FRUTODRILO",
        desc:"nada felizmente en agua profunda",
        image:"glorbo.png",
        correct:"ACUATICO"
    },

    {
        animal:"PIPIPOPO DESERTINO",
        desc:"tolera calor extremo y arena infinita",
        image:"desertino.png",
        correct:"DESIERTO"
    },

    {
        animal:"RATATATA BING BONG",
        desc:"vive en llanuras llenas de pasto",
        image:"bingbong.png",
        correct:"PRADERA"
    },

    {
        animal:"FROZENINI PASTELONI",
        desc:"sobrevive en frio absurdo y nieve",
        image:"frozenini.png",
        correct:"TUNDRA"
    }

];

questions.sort(() => Math.random() - 0.5);

let current = 0;

function loadQuestion(){

    const q = questions[current];

    document.getElementById("animalName").innerText = q.animal;

    document.getElementById("animalDesc").innerText = q.desc;

    document.getElementById("animalImage").src = q.image;

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    const shuffledBiomes = [...biomes].sort(() => Math.random() - 0.5);

    shuffledBiomes.forEach(b => {

        const div = document.createElement("div");

        div.classList.add("option");

        div.innerHTML = `
            <img src="${b.image}">
            <p>${b.name}</p>
        `;

        div.onclick = () => checkAnswer(div, b.name);

        optionsDiv.appendChild(div);

    });

    document.getElementById("result").innerText = "";

}

function checkAnswer(element, answer){

    const correct = questions[current].correct;

    const allOptions = document.querySelectorAll(".option");

    allOptions.forEach(opt => {

        opt.style.pointerEvents = "none";

    });

    if(answer === correct){

        element.classList.add("correct");

        document.getElementById("result").innerText = "CORRECTO 😎";

        document.body.style.background = "#9dff9d";

        setTimeout(() => {

            document.body.style.background = "#89c2ff";

        }, 400);

    }else{

        element.classList.add("wrong");

        document.getElementById("result").innerText = "INCORRECTO XD";

        allOptions.forEach(opt => {

            if(opt.innerText.includes(correct)){

                opt.classList.add("correct");

            }

        });

        document.body.style.background = "#ff9d9d";

        setTimeout(() => {

            document.body.style.background = "#89c2ff";

        }, 400);

    }

}

function nextQuestion(){

    current++;

    if(current >= questions.length){

        questions.sort(() => Math.random() - 0.5);

        current = 0;

    }

    loadQuestion();

}

loadQuestion();

</script>

</body>
</html>
